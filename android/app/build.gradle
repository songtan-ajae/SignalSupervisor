plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.ijemwohajo.signalsupervisor'
    compileSdk 37

    defaultConfig {
        applicationId 'dev.ijemwohajo.signalsupervisor'
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName '0.1.0_1'
    }

    // keystore.properties 는 Git에 없다. 없으면 release 는 서명 없이 빌드된다.
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        def ks = new Properties()
        keystoreFile.withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }

    buildTypes {
        release { minifyEnabled false }
    }

    buildFeatures { compose true; buildConfig true; resValues true }

    // emu: 에뮬레이터 시연용(시뮬레이터·모의 신호). car: 실차 시험용(Pleos SDK 깜빡이·핸들·기어).
    // 패키지가 달라 한 기기에 둘 다 설치된다.
    flavorDimensions 'target'
    productFlavors {
        emu {
            dimension 'target'
            applicationIdSuffix '.emu'
            versionNameSuffix '-emu'
            resValue 'string', 'app_name', '시그널 감독관 (에뮬)'
            buildConfigField 'boolean', 'CAR', 'false'
        }
        car {
            dimension 'target'
            versionNameSuffix '-car'
            resValue 'string', 'app_name', '시그널 감독관'
            buildConfigField 'boolean', 'CAR', 'true'
        }
    }

    sourceSets {
        main {
            // pleos-icons 는 현대차 소유라 Git에 없다. 없으면 직접 만든 대체 아이콘을 쓴다.
            res.srcDirs += [file('pleos-icons/res').exists() ? 'pleos-icons/res' : 'fallback-icons/res']
            assets.srcDirs += ['../../shared']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'

    carImplementation 'ai.pleos.playground:Vehicle:2.3.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}
